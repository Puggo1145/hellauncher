<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HellDriver Tactical HUD</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <aside id="stratagem-hud" class="stratagem-hud visor-curved phase-idle" aria-live="polite">
      <!-- Top-Left Visor Bracket -->
      <div class="visor-corner-mark">
        <span class="corner-l"></span>
        <span class="corner-tick">▸</span>
      </div>

      <!-- Header Bar: [ ✪ 战略配备 STRATAGEMS ] -->
      <div class="hud-header-bar">
        <div class="hud-header-left">
          <svg class="stratagem-emblem" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="2" y="2" width="28" height="28" fill="none" stroke="#ffe900" stroke-width="2.2" />
            <polygon fill="#ffe900" points="16,5 19,12 26,12 20.5,16.5 22.5,24 16,19.5 9.5,24 11.5,16.5 6,12 13,12" />
          </svg>
          <span class="hud-header-title">战略配备</span>
          <span class="hud-header-sub">STRATAGEMS</span>
        </div>
        <div id="hud-state-badge" class="hud-state-badge">WASD</div>
      </div>

      <!-- Optional macOS Accessibility Warning Banner -->
      <div id="permission-banner" class="permission-banner hidden">
        <span class="perm-dot"></span>
        <span>请在「系统设置 → 辅助功能」授权 HellDriver 以启用全局拦截</span>
      </div>

      <!-- Stratagem Cards List -->
      <div id="hud-stratagem-list" class="hud-stratagem-list"></div>

      <!-- Live Input Sequence Footer -->
      <div class="hud-input-footer">
        <div class="live-input-track">
          <span class="track-label">指令序列:</span>
          <div id="live-typed-arrows" class="live-typed-arrows"></div>
        </div>
        <div id="hud-footer-hint" class="hud-footer-hint">松开 CTRL 取消</div>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
